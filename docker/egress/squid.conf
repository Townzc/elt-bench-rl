# Allow-listing forward proxy for rollout containers on the official backend.
# Only the warehouse is reachable; everything else, including the public
# ground truth of the benchmark, is refused.
http_port 3128

acl warehouse dstdomain .snowflakecomputing.com
# Staging storage used by the Snowflake driver for large result sets. Narrow
# these to the hosts returned by `SELECT SYSTEM$ALLOWLIST()` for your account.
acl warehouse_storage dstdomain .amazonaws.com .blob.core.windows.net .storage.googleapis.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow warehouse
http_access allow warehouse_storage
http_access deny all

access_log stdio:/dev/stdout
cache deny all
